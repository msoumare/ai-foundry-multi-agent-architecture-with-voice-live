services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - VOICE_LIVE_ENDPOINT=wss://ai-rtag-agenthubspoke-dev-sdc.services.ai.azure.com/voice-live/realtime
      - VOICE_LIVE_API_VERSION=2025-10-01
      - TOKEN_TIMEOUT_SECONDS=60
      - FRONTEND_ORIGIN=http://localhost:5173

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
