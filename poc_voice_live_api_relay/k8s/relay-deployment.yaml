apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-relay
  labels:
    app: voice-relay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voice-relay
  template:
    metadata:
      labels:
        app: voice-relay
    spec:
      containers:
        - name: relay
          image: <acr-name>.azurecr.io/voice-live-relay:latest
          ports:
            - containerPort: 8000
          env:
            - name: COMPONENT_ENDPOINT_URL
              value: "http://voice-component/api/component/process"
            - name: RELAY_TIMEOUT_SECONDS
              value: "8"
            - name: FRONTEND_ORIGIN
              value: "https://<frontend-host>"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: voice-relay
spec:
  selector:
    app: voice-relay
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP
