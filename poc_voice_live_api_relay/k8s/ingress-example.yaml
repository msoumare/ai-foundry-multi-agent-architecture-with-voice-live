apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voice-relay-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  tls:
    - hosts:
        - <relay-host>
      secretName: relay-tls
  rules:
    - host: <relay-host>
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: voice-relay
                port:
                  number: 80
