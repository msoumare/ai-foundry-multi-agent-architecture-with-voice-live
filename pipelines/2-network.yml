trigger: none

name: 2-network-${{ parameters.env }}-${{ parameters.region }}

parameters:
- name: workload
  displayName: Workload
  type: string
  default: agenthubspoke
  values:
  - agenthubspoke

- name: env
  displayName: Environment
  type: string
  default: dev
  values:
  - dev
  - prd

- name: region
  displayName: Region
  type: string
  default: ne
  values:
  - ne
  - eus
  - sdc
  - ncu
  - gwc

variables:
- group: ${{ parameters.workload }}.infra

- name: service_connection_name
  value: sp-${{ parameters.workload }}-${{ parameters.env }}

- name: resource_group_workload
  value: rg-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}

- name: resource_group_tfstate
  value: rg-tfs-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}

- name: storage_account_tfstate
  value: sttfs${{ parameters.workload }}${{ parameters.env }}${{ parameters.region }}

- name: container_tfstate
  value: tfs${{ parameters.workload }}${{ parameters.env }}${{ parameters.region }}

- name: key_tfstate
  value: tfs${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}.key

- name: terraform_version
  value: '1.11.3'

- name: terraform_working_directory
  value: '$(System.DefaultWorkingDirectory)'

pool:
  vmImage: ubuntu-latest

stages:
########################################
# STAGE 1 - PLAN NETWORK
########################################
- stage: Plan
  displayName: "Terraform Plan - Network Infrastructure"
  jobs:
  - job: TerraformPlan
    displayName: "Plan Network (vnet)"
    steps:
    - checkout: self

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: $(terraform_version)

    - task: AzureCLI@2
      displayName: "Terraform Init"
      inputs:
        azureSubscription: $(service_connection_name)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: "$(terraform_working_directory)"
        inlineScript: |
          echo "### Terraform INIT (Network Plan) ###"
          rm -rf .terraform
          terraform init \
            -backend-config="resource_group_name=$(resource_group_tfstate)" \
            -backend-config="storage_account_name=$(storage_account_tfstate)" \
            -backend-config="container_name=$(container_tfstate)" \
            -backend-config="key=$(key_tfstate)" \
            -backend-config="use_azuread_auth=true"

    - task: AzureCLI@2
      displayName: "Terraform Import Existing P2S Resources (if needed)"
      inputs:
        azureSubscription: $(service_connection_name)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: "$(terraform_working_directory)"
        inlineScript: |
          set -euo pipefail

          if ! grep -E '^enable_p2s_vpn\s*=\s*true' "./environments/${{ parameters.env }}.tfvars" >/dev/null; then
            echo "P2S VPN disabled in tfvars; skipping P2S import step."
            exit 0
          fi

          SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
          RG_NAME="$(resource_group_workload)"
          VNET_NAME="vnet-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}"
          PIP_NAME="pip-vpngw-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}"
          VNG_NAME="vpngw-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}"

          SUBNET_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.Network/virtualNetworks/${VNET_NAME}/subnets/GatewaySubnet"
          PIP_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.Network/publicIPAddresses/${PIP_NAME}"
          VNG_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.Network/virtualNetworkGateways/${VNG_NAME}"

          import_if_exists() {
            local state_address="$1"
            local resource_id="$2"

            if terraform state list | grep -Fx "$state_address" >/dev/null 2>&1; then
              echo "State already contains ${state_address}; skipping import."
              return 0
            fi

            if ! az resource show --ids "$resource_id" >/dev/null 2>&1; then
              echo "Resource not found for ${state_address}; skipping import."
              return 0
            fi

            echo "Importing ${state_address}"
            terraform import \
              -input=false \
              -var-file="./environments/${{ parameters.env }}.tfvars" \
              "$state_address" "$resource_id"
          }

          import_if_exists "module.p2s_vpn[0].azurerm_subnet.gateway" "$SUBNET_ID"
          import_if_exists "module.p2s_vpn[0].azurerm_public_ip.vpn_gateway" "$PIP_ID"
          import_if_exists "module.p2s_vpn[0].azurerm_virtual_network_gateway.p2s" "$VNG_ID"

    - task: AzureCLI@2
      displayName: "Terraform Plan - Network"
      inputs:
        azureSubscription: $(service_connection_name)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: "$(terraform_working_directory)"
        inlineScript: |
          echo "### TERRAFORM PLAN - Network Infrastructure ###"
          # Target network infrastructure, including Bastion for secure SSH access
          P2S_TARGET=""
          if grep -E '^enable_p2s_vpn\s*=\s*true' "./environments/${{ parameters.env }}.tfvars" >/dev/null; then
            echo "P2S VPN is enabled in tfvars; including module.p2s_vpn[0] in target plan."
            P2S_TARGET="-target=module.p2s_vpn[0]"
          fi

          terraform plan \
            -target=azurerm_resource_group.main \
            -target=module.vnet \
            -target=azurerm_public_ip.bastion \
            -target=azurerm_bastion_host.main \
            ${P2S_TARGET} \
            -var-file="./environments/${{ parameters.env }}.tfvars" \
            -out=tfplan-network 

    - task: PublishPipelineArtifact@1
      displayName: "Publish Network plan"
      inputs:
        artifactName: "tfplan-network"
        targetPath: "$(terraform_working_directory)/tfplan-network"

########################################
# STAGE 2 — APPLY NETWORK
########################################
- stage: Apply
  displayName: "Terraform Apply - Network Infrastructure"
  dependsOn: Plan
  condition: succeeded()
  jobs:
  - deployment: TerraformApply
    displayName: "Apply Network Infrastructure"
    environment: "Infra-${{ parameters.env }}-Network"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: $(terraform_version)

          - task: DownloadPipelineArtifact@2
            inputs:
              artifactName: "tfplan-network"
              downloadPath: "$(terraform_working_directory)"

          - task: AzureCLI@2
            displayName: "Terraform Init"
            inputs:
              azureSubscription: $(service_connection_name)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: "$(terraform_working_directory)"
              inlineScript: |
                echo "### Terraform INIT (Network Apply) ###"
                rm -rf .terraform
                terraform init \
                  -backend-config="resource_group_name=$(resource_group_tfstate)" \
                  -backend-config="storage_account_name=$(storage_account_tfstate)" \
                  -backend-config="container_name=$(container_tfstate)" \
                  -backend-config="key=$(key_tfstate)" \
                  -backend-config="use_azuread_auth=true"

          - task: AzureCLI@2
            displayName: "Terraform Import Existing P2S Resources (if needed)"
            inputs:
              azureSubscription: $(service_connection_name)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: "$(terraform_working_directory)"
              inlineScript: |
                set -euo pipefail

                if ! grep -E '^enable_p2s_vpn\s*=\s*true' "./environments/${{ parameters.env }}.tfvars" >/dev/null; then
                  echo "P2S VPN disabled in tfvars; skipping P2S import step."
                  exit 0
                fi

                SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                RG_NAME="$(resource_group_workload)"
                VNET_NAME="vnet-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}"
                PIP_NAME="pip-vpngw-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}"
                VNG_NAME="vpngw-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}"

                SUBNET_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.Network/virtualNetworks/${VNET_NAME}/subnets/GatewaySubnet"
                PIP_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.Network/publicIPAddresses/${PIP_NAME}"
                VNG_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.Network/virtualNetworkGateways/${VNG_NAME}"

                import_if_exists() {
                  local state_address="$1"
                  local resource_id="$2"

                  if terraform state list | grep -Fx "$state_address" >/dev/null 2>&1; then
                    echo "State already contains ${state_address}; skipping import."
                    return 0
                  fi

                  if ! az resource show --ids "$resource_id" >/dev/null 2>&1; then
                    echo "Resource not found for ${state_address}; skipping import."
                    return 0
                  fi

                  echo "Importing ${state_address}"
                  terraform import \
                    -input=false \
                    -var-file="./environments/${{ parameters.env }}.tfvars" \
                    "$state_address" "$resource_id"
                }

                import_if_exists "module.p2s_vpn[0].azurerm_subnet.gateway" "$SUBNET_ID"
                import_if_exists "module.p2s_vpn[0].azurerm_public_ip.vpn_gateway" "$PIP_ID"
                import_if_exists "module.p2s_vpn[0].azurerm_virtual_network_gateway.p2s" "$VNG_ID"

          - task: AzureCLI@2
            displayName: "Terraform Apply - Network"
            inputs:
              azureSubscription: $(service_connection_name)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: "$(terraform_working_directory)"
              inlineScript: |
                echo "### APPLY Network Infrastructure ###"
                terraform apply -input=false tfplan-network
