trigger: none

name: 2-network-${{ parameters.env }}-${{ parameters.region }}

parameters:
- name: workload
  displayName: Workload
  type: string
  default: agenthubspoke
  values:
  - agenthubspoke

- name: env
  displayName: Environment
  type: string
  default: dev
  values:
  - dev
  - prd

- name: region
  displayName: Region
  type: string
  default: ne
  values:
  - ne
  - eus

variables:
- group: ${{ parameters.workload }}.infra

- name: service_connection_name
  value: sp-${{ parameters.workload }}-${{ parameters.env }}

- name: resource_group_workload
  value: rg-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}

- name: resource_group_tfstate
  value: rg-tfs-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}

- name: storage_account_tfstate
  value: sttfs${{ parameters.workload }}${{ parameters.env }}${{ parameters.region }}

- name: container_tfstate
  value: tfs${{ parameters.workload }}${{ parameters.env }}${{ parameters.region }}

- name: key_tfstate
  value: tfs${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}.key

# Default region → NE
- name: location
  value: northeurope

# Override → East US
- ${{ if eq(parameters.region, 'eus') }}:
  - name: location
    value: eastus

- name: terraform_version
  value: '1.11.3'

- name: terraform_working_directory
  value: '$(System.DefaultWorkingDirectory)'

pool:
  vmImage: ubuntu-latest

stages:
########################################
# STAGE 1 - PLAN NETWORK
########################################
- stage: Plan
  displayName: "Terraform Plan - Network Infrastructure"
  jobs:
  - job: TerraformPlan
    displayName: "Plan Network (vnet)"
    steps:
    - checkout: self

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: $(terraform_version)

    - task: AzureCLI@2
      displayName: "Terraform Init"
      inputs:
        azureSubscription: $(service_connection_name)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: "$(terraform_working_directory)"
        inlineScript: |
          echo "### Terraform INIT (Network Plan) ###"
          rm -rf .terraform
          terraform init \
            -backend-config="resource_group_name=$(resource_group_tfstate)" \
            -backend-config="storage_account_name=$(storage_account_tfstate)" \
            -backend-config="container_name=$(container_tfstate)" \
            -backend-config="key=$(key_tfstate)" \
            -backend-config="use_azuread_auth=true"

    - task: AzureCLI@2
      displayName: "Terraform Plan - Network"
      inputs:
        azureSubscription: $(service_connection_name)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: "$(terraform_working_directory)"
        inlineScript: |
          echo "### TERRAFORM PLAN - Network Infrastructure ###"
          # Target network infrastructure, including Bastion for secure SSH access
          P2S_TARGET=""
          if grep -E '^enable_p2s_vpn\s*=\s*true' "./environments/${{ parameters.env }}.tfvars" >/dev/null; then
            echo "P2S VPN is enabled in tfvars; including module.p2s_vpn[0] in target plan."
            P2S_TARGET="-target=module.p2s_vpn[0]"
          fi

          terraform plan \
            -target=azurerm_resource_group.main \
            -target=module.vnet \
            -target=azurerm_public_ip.bastion \
            -target=azurerm_bastion_host.main \
            ${P2S_TARGET} \
            -var-file="./environments/${{ parameters.env }}.tfvars" \
            -out=tfplan-network 

    - task: PublishPipelineArtifact@1
      displayName: "Publish Network plan"
      inputs:
        artifactName: "tfplan-network"
        targetPath: "$(terraform_working_directory)/tfplan-network"

########################################
# STAGE 2 — APPLY NETWORK
########################################
- stage: Apply
  displayName: "Terraform Apply - Network Infrastructure"
  dependsOn: Plan
  condition: succeeded()
  jobs:
  - deployment: TerraformApply
    displayName: "Apply Network Infrastructure"
    environment: "Infra-${{ parameters.env }}-Network"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: $(terraform_version)

          - task: DownloadPipelineArtifact@2
            inputs:
              artifactName: "tfplan-network"
              downloadPath: "$(terraform_working_directory)"

          - task: AzureCLI@2
            displayName: "Terraform Init"
            inputs:
              azureSubscription: $(service_connection_name)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: "$(terraform_working_directory)"
              inlineScript: |
                echo "### Terraform INIT (Network Apply) ###"
                rm -rf .terraform
                terraform init \
                  -backend-config="resource_group_name=$(resource_group_tfstate)" \
                  -backend-config="storage_account_name=$(storage_account_tfstate)" \
                  -backend-config="container_name=$(container_tfstate)" \
                  -backend-config="key=$(key_tfstate)" \
                  -backend-config="use_azuread_auth=true"

          - task: AzureCLI@2
            displayName: "Terraform Apply - Network"
            inputs:
              azureSubscription: $(service_connection_name)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: "$(terraform_working_directory)"
              inlineScript: |
                echo "### APPLY Network Infrastructure ###"
                terraform apply -input=false tfplan-network

          - task: AzureCLI@2
            displayName: "Configure P2S DNS Server (Post-Apply)"
            inputs:
              azureSubscription: $(service_connection_name)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: "$(terraform_working_directory)"
              inlineScript: |
                set -e
                TFVARS_FILE="./environments/${{ parameters.env }}.tfvars"

                if ! grep -E '^enable_p2s_vpn\s*=\s*true' "$TFVARS_FILE" >/dev/null; then
                  echo "P2S VPN disabled in tfvars; skipping VPN DNS configuration."
                  exit 0
                fi

                DNS_IP=$(grep -E '^dns_resolver_inbound_ip\s*=' "$TFVARS_FILE" | awk -F= '{print $2}' | tr -d ' "')
                if [[ -z "$DNS_IP" ]]; then
                  echo "dns_resolver_inbound_ip is missing in $TFVARS_FILE"
                  exit 1
                fi

                GATEWAY_NAME="vpngw-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}"
                echo "Configuring VPN gateway '$GATEWAY_NAME' to use P2S DNS server $DNS_IP"

                az network vnet-gateway update \
                  --resource-group "$(resource_group_workload)" \
                  --name "$GATEWAY_NAME" \
                  --set "vpnClientConfiguration.vpnClientDnsServers=[\"${DNS_IP}\"]"

                echo "P2S DNS server configuration completed."
