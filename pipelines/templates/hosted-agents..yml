trigger: none
parameters:
- name: pipelineName
  type: string
  default: ""
- name: azureServiceConnection
  type: string
  default: ""
- name: subscriptionId
  type: string
  default: ""
- name: tenantId
  type: string
  default: ""
- name: resourceGroup
  type: string
  default: ""
- name: projectId
  type: string
  default: ""
- name: projectEndpoint
  type: string
  default: ""
- name: containerRegistryEndpoint
  type: string
  default: ""
- name: modelDeployment
  type: string
  default: "gpt-4.1-mini"
- name: agentFolders
  type: string
  default: ""
stages:
- stage: DeployHostedAgents
  displayName: Deploy hosted agents with azd
  jobs:
  - job: Deploy
    displayName: Run deploy_hosted_agents_azd.ps1
    steps:
    - checkout: self
    - task: AzureCLI@2
      displayName: Deploy agents
      inputs:
        azureSubscription: ${{ parameters.azureServiceConnection }}
        scriptType: pscore
        scriptLocation: inlineScript
        workingDirectory: $(Build.SourcesDirectory)/agents
        inlineScript: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace("${{ parameters.subscriptionId }}")) {
            throw "Parameter subscriptionId is required."
          }
          if ([string]::IsNullOrWhiteSpace("${{ parameters.resourceGroup }}")) {
            throw "Parameter resourceGroup is required."
          }
          if ([string]::IsNullOrWhiteSpace("${{ parameters.projectId }}")) {
            throw "Parameter projectId is required."
          }
          if ([string]::IsNullOrWhiteSpace("${{ parameters.projectEndpoint }}")) {
            throw "Parameter projectEndpoint is required."
          }
          if ([string]::IsNullOrWhiteSpace("${{ parameters.containerRegistryEndpoint }}")) {
            throw "Parameter containerRegistryEndpoint is required."
          }
          # Ensure azd is available on Microsoft-hosted agents.
          if (-not (Get-Command azd -ErrorAction SilentlyContinue)) {
            curl -fsSL https://aka.ms/install-azd.sh | bash
            Write-Host "##vso[task.prependpath]$HOME/.azd/bin"
            $env:PATH = "$HOME/.azd/bin:$env:PATH"
          }
          az version
          azd version
          # Keep azd extension auth pinned to Azure CLI identity.
          $env:AZURE_TOKEN_CREDENTIALS = "AzureCliCredential"
          # Normalize folder list from CSV string.
          $folders = "${{ parameters.agentFolders }}".Split(",") |
            ForEach-Object { $_.Trim() } |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if (-not $folders -or $folders.Count -eq 0) {
            throw "Parameter agentFolders must contain at least one folder name."
          }
          if ([string]::IsNullOrWhiteSpace("${{ parameters.tenantId }}")) {
            $tenantId = (az account show --query tenantId -o tsv).Trim()
          }
          else {
            $tenantId = "${{ parameters.tenantId }}"
          }
          if (-not (Test-Path "./deploy_hosted_agents_azd.ps1" -PathType Leaf)) {
            throw "deploy_hosted_agents_azd.ps1 not found in agents."
          }
          if (-not (Test-Path "./deploy-logs" -PathType Container)) {
            New-Item -ItemType Directory -Path "./deploy-logs" | Out-Null
          }
          & ./deploy_hosted_agents_azd.ps1 `
            -AgentFolders $folders `
            -SubscriptionId "${{ parameters.subscriptionId }}" `
            -TenantId $tenantId `
            -ResourceGroup "${{ parameters.resourceGroup }}" `
            -ProjectId "${{ parameters.projectId }}" `
            -ProjectEndpoint "${{ parameters.projectEndpoint }}" `
            -ContainerRegistryEndpoint "${{ parameters.containerRegistryEndpoint }}" `
            -ModelDeployment "${{ parameters.modelDeployment }}"
    - task: PublishBuildArtifacts@1
      displayName: Publish deploy logs
      condition: always()
      inputs:
        PathtoPublish: $(Build.SourcesDirectory)/agents/deploy-logs
        ArtifactName: deploy-logs
        publishLocation: Container
