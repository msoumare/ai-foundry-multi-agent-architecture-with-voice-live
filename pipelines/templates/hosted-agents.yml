trigger: none
parameters:
- name: pipelineName
  type: string
  default: ""
- name: azureServiceConnection
  type: string
  default: ""
- name: subscriptionId
  type: string
  default: ""
- name: tenantId
  type: string
  default: ""
- name: resourceGroup
  type: string
  default: ""
- name: projectId
  type: string
  default: ""
- name: projectEndpoint
  type: string
  default: ""
- name: containerRegistryEndpoint
  type: string
  default: ""
- name: modelDeployment
  type: string
  default: "gpt-4.1-mini"
- name: agentFolders
  type: string
  default: ""
- name: jobPool
  type: object
  default:
    vmImage: ubuntu-latest
stages:
- stage: DeployHostedAgents
  displayName: Deploy hosted agents with azd
  jobs:
  - job: Deploy
    displayName: Run deploy_hosted_agents_azd.ps1
    pool: ${{ parameters.jobPool }}
    steps:
    - checkout: self
    - bash: |
        set -euo pipefail

        echo "Bootstrapping agent prerequisites (az, pwsh, azd)..."

        # apt and the Azure CLI installer fail hard on a transient DNS blip; retry instead.
        echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null

        wait_for_dns() {
          local host="$1"
          for attempt in $(seq 1 30); do
            if getent hosts "$host" >/dev/null; then
              return 0
            fi
            echo "DNS for $host not resolvable yet (attempt $attempt/30); retrying in 10s..."
            sleep 10
          done
          echo "##vso[task.logissue type=error]Agent $(hostname) cannot resolve $host. Check outbound DNS/NAT for the agent subnet, or reimage this scale set instance."
          return 1
        }

        if ! command -v az >/dev/null 2>&1; then
          echo "Installing Azure CLI..."
          wait_for_dns azure.archive.ubuntu.com
          curl -sL --retry 5 --retry-delay 10 https://aka.ms/InstallAzureCLIDeb | sudo bash
        fi

        if ! command -v pwsh >/dev/null 2>&1; then
          echo "Installing PowerShell..."
          if command -v apt-get >/dev/null 2>&1; then
            wait_for_dns packages.microsoft.com
            sudo apt-get update
            sudo apt-get install -y wget apt-transport-https software-properties-common
            wget -q https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
            sudo dpkg -i packages-microsoft-prod.deb
            rm -f packages-microsoft-prod.deb
            sudo apt-get update
            sudo apt-get install -y powershell
          else
            echo "Unsupported Linux distribution for automatic PowerShell install. Install pwsh manually on this agent."
            exit 1
          fi
        fi

        if ! command -v azd >/dev/null 2>&1; then
          echo "Installing Azure Developer CLI (azd)..."
          curl -fsSL https://aka.ms/install-azd.sh | bash
          echo "##vso[task.prependpath]$HOME/.azd/bin"
          export PATH="$HOME/.azd/bin:$PATH"
        fi

        az version
        pwsh --version
        azd version
      displayName: Bootstrap agent prerequisites
      condition: eq(variables['Agent.OS'], 'Linux')

    - task: PowerShell@2
      displayName: Bootstrap agent prerequisites (Windows)
      condition: eq(variables['Agent.OS'], 'Windows_NT')
      inputs:
        pwsh: false
        targetType: inline
        script: |
          $ErrorActionPreference = "Stop"

          Write-Host "Bootstrapping agent prerequisites (az, pwsh, azd)..."

          if (-not (Get-Command az -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Azure CLI..."
            $azCliMsi = Join-Path $env:TEMP "AzureCLI.msi"
            Invoke-WebRequest -Uri "https://aka.ms/installazurecliwindows" -OutFile $azCliMsi
            Start-Process -FilePath msiexec.exe -ArgumentList "/I `"$azCliMsi`" /qn /norestart" -Wait

            $azPaths = @(
              "C:\Program Files\Microsoft SDKs\Azure\CLI2\wbin",
              "C:\Program Files (x86)\Microsoft SDKs\Azure\CLI2\wbin"
            )
            foreach ($p in $azPaths) {
              if (Test-Path $p) {
                Write-Host "##vso[task.prependpath]$p"
              }
            }
          }

          if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) {
            Write-Host "Installing PowerShell 7 (portable)..."
            $psVer = "7.4.4"
            $zipPath = Join-Path $env:TEMP "powershell-$psVer-win-x64.zip"
            $extractPath = Join-Path $env:AGENT_TEMPDIRECTORY "pwsh-$psVer"
            Invoke-WebRequest -Uri "https://github.com/PowerShell/PowerShell/releases/download/v$psVer/PowerShell-$psVer-win-x64.zip" -OutFile $zipPath
            if (Test-Path $extractPath) { Remove-Item -Path $extractPath -Recurse -Force }
            Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
            Write-Host "##vso[task.prependpath]$extractPath"
          }

          if (-not (Get-Command azd -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Azure Developer CLI (azd)..."
            winget install Microsoft.Azd --accept-source-agreements --accept-package-agreements --silent
          }

          az version
          pwsh --version
          azd version

    - task: AzureCLI@2
      displayName: Deploy agents
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      inputs:
        azureSubscription: ${{ parameters.azureServiceConnection }}
        addSpnToEnvironment: true
        scriptType: pscore
        scriptLocation: inlineScript
        workingDirectory: $(Build.SourcesDirectory)/agents
        inlineScript: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace("${{ parameters.subscriptionId }}")) {
            throw "Parameter subscriptionId is required."
          }
          if ([string]::IsNullOrWhiteSpace("${{ parameters.resourceGroup }}")) {
            throw "Parameter resourceGroup is required."
          }
          if ([string]::IsNullOrWhiteSpace("${{ parameters.projectId }}")) {
            throw "Parameter projectId is required."
          }
          if ([string]::IsNullOrWhiteSpace("${{ parameters.projectEndpoint }}")) {
            throw "Parameter projectEndpoint is required."
          }
          if ([string]::IsNullOrWhiteSpace("${{ parameters.containerRegistryEndpoint }}")) {
            throw "Parameter containerRegistryEndpoint is required."
          }
          # Ensure azd is available on Microsoft-hosted agents.
          if (-not (Get-Command azd -ErrorAction SilentlyContinue)) {
            curl -fsSL https://aka.ms/install-azd.sh | bash
            Write-Host "##vso[task.prependpath]$HOME/.azd/bin"
            $env:PATH = "$HOME/.azd/bin:$env:PATH"
          }
          az version
          azd version
          # Keep azd extension auth pinned to Azure CLI identity.
          Write-Host "Checking azd auth status in pipeline step..."
          $azdStatus = azd auth status --no-prompt 2>&1 | Out-String
          $isAzdLoggedIn = ($LASTEXITCODE -eq 0 -and ($azdStatus -notmatch "(?i)not logged in|logged out"))
          if (-not $isAzdLoggedIn) {
            if ([string]::IsNullOrWhiteSpace($env:servicePrincipalId) -or [string]::IsNullOrWhiteSpace($env:tenantId)) {
              throw "azd is not authenticated and workload identity context is missing. Ensure AzureCLI@2 uses addSpnToEnvironment: true."
            }

            Write-Host "Logging into azd with Azure DevOps workload identity federation..."
            azd auth login --client-id $env:servicePrincipalId --tenant-id $env:tenantId --federated-credential-provider azure-pipelines --no-prompt
            if ($LASTEXITCODE -ne 0) {
              throw "azd auth login failed in pipeline step."
            }

            $azdStatus = azd auth status --no-prompt 2>&1 | Out-String
            $isAzdLoggedIn = ($LASTEXITCODE -eq 0 -and ($azdStatus -notmatch "(?i)not logged in|logged out"))
            if (-not $isAzdLoggedIn) {
              throw "azd auth status still reports logged out after workload identity login. Ensure pipeline setting 'Allow scripts to access OAuth token' is enabled."
            }
          }
          $env:AZURE_TOKEN_CREDENTIALS = "AzureCliCredential"
          # Normalize folder list from CSV string.
          $folders = "${{ parameters.agentFolders }}".Split(",") |
            ForEach-Object { $_.Trim() } |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if (-not $folders -or $folders.Count -eq 0) {
            throw "Parameter agentFolders must contain at least one folder name."
          }
          if ([string]::IsNullOrWhiteSpace("${{ parameters.tenantId }}")) {
            $tenantId = (az account show --query tenantId -o tsv).Trim()
          }
          else {
            $tenantId = "${{ parameters.tenantId }}"
          }
          if (-not (Test-Path "./deploy_hosted_agents_azd.ps1" -PathType Leaf)) {
            throw "deploy_hosted_agents_azd.ps1 not found in agents."
          }
          if (-not (Test-Path "./deploy-logs" -PathType Container)) {
            New-Item -ItemType Directory -Path "./deploy-logs" | Out-Null
          }
          & ./deploy_hosted_agents_azd.ps1 `
            -AgentFolders $folders `
            -SubscriptionId "${{ parameters.subscriptionId }}" `
            -TenantId $tenantId `
            -ResourceGroup "${{ parameters.resourceGroup }}" `
            -ProjectId "${{ parameters.projectId }}" `
            -ProjectEndpoint "${{ parameters.projectEndpoint }}" `
            -ContainerRegistryEndpoint "${{ parameters.containerRegistryEndpoint }}" `
            -ModelDeployment "${{ parameters.modelDeployment }}"
    - task: PublishBuildArtifacts@1
      displayName: Publish deploy logs
      condition: always()
      inputs:
        PathtoPublish: $(Build.SourcesDirectory)/agents/deploy-logs
        ArtifactName: deploy-logs
        publishLocation: Container
