trigger:
  branches:
    include:
      - main
  paths:
    include:
      - poc_voice_live_api_agent/hub_agent/**
      - pipelines/6-hub-agent-foundry.yml

name: 6-hub-agent-foundry-${{ parameters.env }}-${{ parameters.region }}-$(Date:yyyyMMdd)$(Rev:.r)

parameters:
- name: workload
  displayName: Workload
  type: string
  default: agenthubspoke
  values:
  - agenthubspoke

- name: env
  displayName: Environment
  type: string
  default: dev
  values:
  - dev
  - prd

- name: region
  displayName: Region
  type: string
  default: ne
  values:
  - ne
  - eus
  - sdc
  - ncu
  
variables:
- group: ${{ parameters.workload }}.infra

- name: service_connection_name
  value: sp-${{ parameters.workload }}-${{ parameters.env }}

- name: hub_agent_path
  value: poc_voice_live_api_agent/hub_agent

# Required from variable group:
# - resource_group_workload (for example rg-agenthubspoke-dev-ne)
# - FOUNDRY_PROJECT_ID (full ARM ID of AI Foundry project)
# - FOUNDRY_PROJECT_ENDPOINT (https://<account>.services.ai.azure.com/api/projects/<project>)
# - acr_login_server (for example acragenthubspokedevne.azurecr.io)
# - AGENTHUB_MODEL_DEPLOYMENT (optional; defaults to gpt-4.1-mini)

pool:
  vmImage: ubuntu-latest

stages:
- stage: DeployHostedAgent
  displayName: Deploy Hosted Agent (azd)
  jobs:
  - job: DeployHubAgent
    displayName: azd deploy for hub-agent
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: Install azd + extension and deploy hub-agent
      inputs:
        azureSubscription: $(service_connection_name)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: $(hub_agent_path)
        inlineScript: |
          set -euo pipefail

          required=(
            "resource_group_workload"
            "FOUNDRY_PROJECT_ID"
            "FOUNDRY_PROJECT_ENDPOINT"
            "acr_login_server"
          )

          for key in "${required[@]}"; do
            val="${!key:-}"
            if [ -z "$val" ]; then
              echo "Missing required variable: $key"
              exit 1
            fi
          done

          if ! command -v azd >/dev/null 2>&1; then
            curl -fsSL https://aka.ms/install-azd.sh | bash
            export PATH="$HOME/.azd/bin:$PATH"
          fi

          azd version

          azd ext install azure.ai.agents || true
          azd ext upgrade azure.ai.agents || true

          SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
          TENANT_ID="$(az account show --query tenantId -o tsv)"

          azd env set AZURE_SUBSCRIPTION_ID "$SUBSCRIPTION_ID"
          azd env set AZURE_TENANT_ID "$TENANT_ID"
          azd env set AZURE_RESOURCE_GROUP "$(resource_group_workload)"
          azd env set AZURE_RESOURCE_GROUP_NAME "$(resource_group_workload)"

          azd env set AZURE_AI_PROJECT_ID "$(FOUNDRY_PROJECT_ID)"
          azd env set FOUNDRY_PROJECT_ID "$(FOUNDRY_PROJECT_ID)"
          azd env set AZURE_AI_PROJECT_ENDPOINT "$(FOUNDRY_PROJECT_ENDPOINT)"
          azd env set FOUNDRY_PROJECT_ENDPOINT "$(FOUNDRY_PROJECT_ENDPOINT)"

          azd env set AZURE_CONTAINER_REGISTRY_ENDPOINT "$(acr_login_server)"
          azd env set AGENTHUB_MODEL_DEPLOYMENT "$(AGENTHUB_MODEL_DEPLOYMENT)"
          azd env set DEFAULT_MODEL_DEPLOYMENT "$(AGENTHUB_MODEL_DEPLOYMENT)"
          azd env set VOICE_LIVE_UAI_CLIENT_ID "$(VOICE_LIVE_UAI_CLIENT_ID)"

          azd deploy --no-prompt

          azd ai agent show --output table
