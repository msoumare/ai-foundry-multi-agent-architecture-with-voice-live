trigger: none

name: 2-infra-phased-${{ parameters.env }}-${{ parameters.region }}

parameters:
- name: workload
  displayName: Workload
  type: string
  default: uvsupplychain
  values:
  - uvsupplychain

- name: env
  displayName: Environment
  type: string
  default: dev
  values:
  - dev
  - prd

- name: region
  displayName: Region
  type: string
  default: ne
  values:
  - ne
  - eus

- name: phase
  displayName: Deployment Phase
  type: string
  default: phase1
  values:
  - phase1  # Network + Build Agents
  - phase2  # Remaining Infrastructure

variables:
- group: ${{ parameters.workload }}.infra

- name: service_connection_name
  value: sp-${{ parameters.workload }}-${{ parameters.env }}

- name: resource_group_workload
  value: rg-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}

- name: resource_group_tfstate
  value: rg-tfs-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}

- name: storage_account_tfstate
  value: sttfs${{ parameters.workload }}${{ parameters.env }}${{ parameters.region }}

- name: container_tfstate
  value: tfs${{ parameters.workload }}${{ parameters.env }}${{ parameters.region }}

- name: key_tfstate
  value: tfs${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}.key

# Default region → NE
- name: location
  value: northeurope

# Override → East US
- ${{ if eq(parameters.region, 'eus') }}:
  - name: location
    value: eastus

- name: terraform_version
  value: '1.11.3'

- name: terraform_working_directory
  value: '$(System.DefaultWorkingDirectory)'

pool:
  vmImage: ubuntu-latest

stages:
########################################
# PHASE 1 - Network + Build Agents
########################################
- ${{ if eq(parameters.phase, 'phase1') }}:
  - stage: Phase1_Plan
    displayName: "Phase 1: Plan Network + Build Agents"
    jobs:
    - job: TerraformPlan
      displayName: "Plan Phase 1 Infrastructure"
      steps:
      - checkout: self

      - task: TerraformInstaller@1
        displayName: "Install Terraform"
        inputs:
          terraformVersion: $(terraform_version)

      - task: AzureCLI@2
        displayName: "Terraform Init"
        inputs:
          azureSubscription: $(service_connection_name)
          scriptType: bash
          scriptLocation: inlineScript
          workingDirectory: "$(terraform_working_directory)"
          inlineScript: |
            echo "### Terraform INIT (Phase 1 Plan) ###"
            terraform init \
              -backend-config="resource_group_name=$(resource_group_tfstate)" \
              -backend-config="storage_account_name=$(storage_account_tfstate)" \
              -backend-config="container_name=$(container_tfstate)" \
              -backend-config="key=$(key_tfstate)"

      - task: AzureCLI@2
        displayName: "Terraform Plan (Phase 1)"
        inputs:
          azureSubscription: $(service_connection_name)
          scriptType: bash
          scriptLocation: inlineScript
          workingDirectory: "$(terraform_working_directory)"
          inlineScript: |
            echo "### TERRAFORM PLAN (Phase 1) ###"
            # Target only the resources needed for Phase 1
            terraform plan \
              -target=azurerm_resource_group.main \
              -target=module.vnet \
              -target=module.keyvault \
              -target=module.devops_identity \
              -target=module.devops \
              -target=random_password.devops_admin \
              -target=azurerm_key_vault_secret.devops_admin_password \
              -var-file="./environments/${{ parameters.env }}.tfvars" \
              -out=tfplan-phase1 \
              --refresh=false

      - task: PublishPipelineArtifact@1
        displayName: "Publish Phase 1 plan"
        inputs:
          artifactName: "tfplan-phase1"
          targetPath: "$(terraform_working_directory)/tfplan-phase1"

  - stage: Phase1_Apply
    displayName: "Phase 1: Apply Network + Build Agents"
    dependsOn: Phase1_Plan
    condition: succeeded()
    jobs:
    - deployment: TerraformApply
      displayName: "Apply Phase 1 Infrastructure"
      environment: "Infra-${{ parameters.env }}-Phase1"
      strategy:
        runOnce:
          deploy:
            steps:
            - checkout: self

            - task: TerraformInstaller@1
              displayName: "Install Terraform"
              inputs:
                terraformVersion: $(terraform_version)

            - task: DownloadPipelineArtifact@2
              inputs:
                artifactName: "tfplan-phase1"
                downloadPath: "$(terraform_working_directory)"

            - task: AzureCLI@2
              displayName: "Terraform Init"
              inputs:
                azureSubscription: $(service_connection_name)
                scriptType: bash
                scriptLocation: inlineScript
                workingDirectory: "$(terraform_working_directory)"
                inlineScript: |
                  echo "### Terraform INIT (Phase 1 Apply) ###"
                  terraform init \
                    -backend-config="resource_group_name=$(resource_group_tfstate)" \
                    -backend-config="storage_account_name=$(storage_account_tfstate)" \
                    -backend-config="container_name=$(container_tfstate)" \
                    -backend-config="key=$(key_tfstate)" \
                    -lockfile=readonly

            - task: AzureCLI@2
              displayName: "Terraform Apply (Phase 1)"
              inputs:
                azureSubscription: $(service_connection_name)
                scriptType: bash
                scriptLocation: inlineScript
                workingDirectory: "$(terraform_working_directory)"
                inlineScript: |
                  echo "### APPLY Phase 1 ###"
                  terraform apply -input=false tfplan-phase1

########################################
# PHASE 2 - Remaining Infrastructure
########################################
- ${{ if eq(parameters.phase, 'phase2') }}:
  - stage: Phase2_Plan
    displayName: "Phase 2: Plan Remaining Infrastructure"
    jobs:
    - job: TerraformPlan
      displayName: "Plan Phase 2 Infrastructure"
      steps:
      - checkout: self

      - task: TerraformInstaller@1
        displayName: "Install Terraform"
        inputs:
          terraformVersion: $(terraform_version)

      - task: AzureCLI@2
        displayName: "Terraform Init"
        inputs:
          azureSubscription: $(service_connection_name)
          scriptType: bash
          scriptLocation: inlineScript
          workingDirectory: "$(terraform_working_directory)"
          inlineScript: |
            echo "### Terraform INIT (Phase 2 Plan) ###"
            terraform init \
              -backend-config="resource_group_name=$(resource_group_tfstate)" \
              -backend-config="storage_account_name=$(storage_account_tfstate)" \
              -backend-config="container_name=$(container_tfstate)" \
              -backend-config="key=$(key_tfstate)"

      - task: AzureCLI@2
        displayName: "Terraform Plan (Phase 2)"
        inputs:
          azureSubscription: $(service_connection_name)
          scriptType: bash
          scriptLocation: inlineScript
          workingDirectory: "$(terraform_working_directory)"
          inlineScript: |
            echo "### TERRAFORM PLAN (Phase 2) ###"
            terraform plan \
              -var-file="./environments/${{ parameters.env }}.tfvars" \
              -out=tfplan-phase2 \
              --refresh=false

      - task: PublishPipelineArtifact@1
        displayName: "Publish Phase 2 plan"
        inputs:
          artifactName: "tfplan-phase2"
          targetPath: "$(terraform_working_directory)/tfplan-phase2"

  - stage: Phase2_Apply
    displayName: "Phase 2: Apply Remaining Infrastructure"
    dependsOn: Phase2_Plan
    condition: succeeded()
    jobs:
    - deployment: TerraformApply
      displayName: "Apply Phase 2 Infrastructure"
      environment: "Infra-${{ parameters.env }}-Phase2"
      strategy:
        runOnce:
          deploy:
            steps:
            - checkout: self

            - task: TerraformInstaller@1
              displayName: "Install Terraform"
              inputs:
                terraformVersion: $(terraform_version)

            - task: DownloadPipelineArtifact@2
              inputs:
                artifactName: "tfplan-phase2"
                downloadPath: "$(terraform_working_directory)"

            - task: AzureCLI@2
              displayName: "Terraform Init"
              inputs:
                azureSubscription: $(service_connection_name)
                scriptType: bash
                scriptLocation: inlineScript
                workingDirectory: "$(terraform_working_directory)"
                inlineScript: |
                  echo "### Terraform INIT (Phase 2 Apply) ###"
                  terraform init \
                    -backend-config="resource_group_name=$(resource_group_tfstate)" \
                    -backend-config="storage_account_name=$(storage_account_tfstate)" \
                    -backend-config="container_name=$(container_tfstate)" \
                    -backend-config="key=$(key_tfstate)" \
                    -lockfile=readonly

            - task: AzureCLI@2
              displayName: "Terraform Apply (Phase 2)"
              inputs:
                azureSubscription: $(service_connection_name)
                scriptType: bash
                scriptLocation: inlineScript
                workingDirectory: "$(terraform_working_directory)"
                inlineScript: |
                  echo "### APPLY Phase 2 ###"
                  terraform apply -input=false tfplan-phase2