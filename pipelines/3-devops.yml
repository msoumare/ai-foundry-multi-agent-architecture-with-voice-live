trigger: none

name: 3-devops-${{ parameters.env }}-${{ parameters.region }}

parameters:
- name: workload
  displayName: Workload
  type: string
  default: agenthubspoke
  values:
  - agenthubspoke

- name: env
  displayName: Environment
  type: string
  default: dev
  values:
  - dev
  - prd

- name: region
  displayName: Region
  type: string
  default: ne
  values:
  - ne
  - eus
  - sdc
  - ncu
  - gwc  

- name: deploymentMode
  displayName: Deployment Mode
  type: string
  default: rbac-only
  values:
  - rbac-only
  - recover-devops
  
variables:
- group: ${{ parameters.workload }}.infra

- name: service_connection_name
  value: sp-${{ parameters.workload }}-${{ parameters.env }}

- name: resource_group_workload
  value: rg-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}

- name: resource_group_tfstate
  value: rg-tfs-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}

- name: storage_account_tfstate
  value: sttfs${{ parameters.workload }}${{ parameters.env }}${{ parameters.region }}

- name: container_tfstate
  value: tfs${{ parameters.workload }}${{ parameters.env }}${{ parameters.region }}

- name: key_tfstate
  value: tfs${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}.key

- name: terraform_version
  value: '1.11.3'

- name: terraform_working_directory
  value: '$(System.DefaultWorkingDirectory)'

pool:
  vmImage: ubuntu-latest

stages:
########################################
# STAGE 1 - PLAN DEVOPS
########################################
- stage: Plan
  displayName: "Terraform Plan - DevOps Infrastructure"
  jobs:
  - job: TerraformPlan
    displayName: "Plan DevOps (Key Vault, Build Agents, Identity)"
    steps:
    - checkout: self

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: $(terraform_version)

    - task: AzureCLI@2
      displayName: "Terraform Init"
      inputs:
        azureSubscription: $(service_connection_name)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: "$(terraform_working_directory)"
        inlineScript: |
          echo "### Terraform INIT (DevOps Plan) ###"
          rm -rf .terraform
          terraform init \
            -backend-config="resource_group_name=$(resource_group_tfstate)" \
            -backend-config="storage_account_name=$(storage_account_tfstate)" \
            -backend-config="container_name=$(container_tfstate)" \
            -backend-config="key=$(key_tfstate)" \
            -backend-config="use_azuread_auth=true"

    - task: AzureCLI@2
      displayName: "Terraform Plan - DevOps"
      inputs:
        azureSubscription: $(service_connection_name)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: "$(terraform_working_directory)"
        inlineScript: |
          if [[ "${{ parameters.deploymentMode }}" == "recover-devops" ]]; then
            echo "### TERRAFORM PLAN - DevOps recovery mode ###"
            # One-time recovery of DevOps resources that were deleted.
            terraform plan \
              -target=module.keyvault \
              -target=module.acr \
              -target=azurerm_role_assignment.deployer_kv_secrets_officer \
              -target=tls_private_key.devops \
              -target=module.devops_identity \
              -target=module.devops \
              -var-file="./environments/${{ parameters.env }}.tfvars" \
              -out=tfplan-devops
          else
            echo "### TERRAFORM PLAN - DevOps RBAC only ###"
            # Target only Foundry role assignment for the DevOps managed identity.
            # This avoids accidental updates/deletes in network, private endpoints, and core services.
            terraform plan \
              -target=module.devops_identity.azurerm_role_assignment.foundry_project_manager \
              -var-file="./environments/${{ parameters.env }}.tfvars" \
              -out=tfplan-devops
          fi

          terraform show -no-color tfplan-devops > tfplan-devops.txt
          if grep -Eq "will be destroyed|Plan: .* to destroy" tfplan-devops.txt; then
            echo "ERROR: Plan contains delete actions. Review changes before apply."
            echo "Deployment mode: ${{ parameters.deploymentMode }}"
            exit 1
          fi

    - task: PublishPipelineArtifact@1
      displayName: "Publish DevOps plan"
      inputs:
        artifactName: "tfplan-devops"
        targetPath: "$(terraform_working_directory)/tfplan-devops"

########################################
# STAGE 2 — APPLY DEVOPS
########################################
- stage: Apply
  displayName: "Terraform Apply - DevOps Infrastructure"
  dependsOn: Plan
  condition: succeeded()
  jobs:
  - deployment: TerraformApply
    displayName: "Apply DevOps Infrastructure"
    environment: "Infra-${{ parameters.env }}-DevOps"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: $(terraform_version)

          - task: DownloadPipelineArtifact@2
            inputs:
              artifactName: "tfplan-devops"
              downloadPath: "$(terraform_working_directory)"

          - task: AzureCLI@2
            displayName: "Terraform Init"
            inputs:
              azureSubscription: $(service_connection_name)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: "$(terraform_working_directory)"
              inlineScript: |
                echo "### Terraform INIT (DevOps Apply) ###"
                rm -rf .terraform
                terraform init \
                  -backend-config="resource_group_name=$(resource_group_tfstate)" \
                  -backend-config="storage_account_name=$(storage_account_tfstate)" \
                  -backend-config="container_name=$(container_tfstate)" \
                  -backend-config="key=$(key_tfstate)" \
                  -backend-config="use_azuread_auth=true"

          - task: AzureCLI@2
            displayName: "Terraform Apply - DevOps"
            inputs:
              azureSubscription: $(service_connection_name)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: "$(terraform_working_directory)"
              inlineScript: |
                echo "### APPLY DevOps Infrastructure ###"
                terraform apply -input=false tfplan-devops
