trigger: none

name: 1-init-${{ parameters.env }}-${{ parameters.region }}

parameters:
- name: workload
  displayName: Workload
  type: string
  default: agenthubspoke
  values:
  - agenthubspoke

- name: env
  displayName: Environment
  type: string
  default: dev
  values:
  - dev
  - prd

- name: region
  displayName: Region
  type: string
  default: ne
  values:
  - ne
  - eus
  - sdc
  - ncu
  - gwc

variables:
- group: ${{ parameters.workload }}.infra

- name: service_connection_name
  value: sp-${{ parameters.workload }}-${{ parameters.env }}

- name: resource_group_workload
  value: rg-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}

- name: resource_group_tfstate
  value: rg-tfs-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}

- name: storage_account_tfstate
  value: sttfs${{ parameters.workload }}${{ parameters.env }}${{ parameters.region }}

- name: container_tfstate
  value: tfs${{ parameters.workload }}${{ parameters.env }}${{ parameters.region }}

- name: key_tfstate
  value: tfs${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}.key

- name: region
  value: ${{ parameters.region }}

# Default region → NE
- name: location
  value: northeurope

# Override
- ${{ if eq(parameters.region, 'eus') }}:
  - name: location
    value: eastus
- ${{ if eq(parameters.region, 'sdc') }}:
  - name: location
    value: swedencentral
- ${{ if eq(parameters.region, 'ncu') }}:
  - name: location
    value: northcentralus
- ${{ if eq(parameters.region, 'gwc') }}:
  - name: location
    value: germanywestcentral

pool:
  name: Azure Pipelines
  vmImage: ubuntu-latest

jobs:
  - job: TFState
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: Login to Azure Public Cloud
      inputs:
        azureSubscription: $(service_connection_name)
        inlineScript: |
          # echo "Creating resource group workload"
          # az group create \
          #   --name $(resource_group_workload) \
          #   --location $(location)

          echo "Creating resource group tfstate"
          az group create \
            --name $(resource_group_tfstate) \
            --location $(location)

          echo "Creating tfstate storage account"
          az storage account create \
            --resource-group $(resource_group_tfstate) \
            --name $(storage_account_tfstate) \
            --sku Standard_LRS \
            --encryption-services blob \
            --location $(location)

          echo "Creating tfstate container"
          az storage container create \
            --name $(container_tfstate) \
            --account-name $(storage_account_tfstate) \
            --auth-mode login    

        scriptLocation: 'inlineScript'
        scriptType: 'bash' 

