trigger: none
# If you later want auto-trigger on main:
# trigger:
#   branches:
#     include:
#     - main

name: 2-infra-${{ parameters.env }}-${{ parameters.region }}

parameters:
- name: workload
  displayName: Workload
  type: string
  default: uvsupplychain
  values:
  - uvsupplychain

- name: env
  displayName: Environment
  type: string
  default: dev
  values:
  - dev
  - prd

- name: region
  displayName: Region
  type: string
  default: ne
  values:
  - ne
  - eus

variables:
- group: ${{ parameters.workload }}.infra

- name: service_connection_name
  value: sp-${{ parameters.workload }}-${{ parameters.env }}

- name: resource_group_workload
  value: rg-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}

- name: resource_group_tfstate
  value: rg-tfs-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}

- name: storage_account_tfstate
  value: sttfs${{ parameters.workload }}${{ parameters.env }}${{ parameters.region }}

- name: container_tfstate
  value: tfs${{ parameters.workload }}${{ parameters.env }}${{ parameters.region }}

- name: key_tfstate
  value: tfs${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}.key

# Default region → NE
- name: location
  value: northeurope

# Override → East US
- ${{ if eq(parameters.region, 'eus') }}:
  - name: location
    value: eastus

- name: terraform_version
  value: '1.11.3'

# Where your .tf live. If TF is in a subfolder (e.g. infra/),
# change this to '$(System.DefaultWorkingDirectory)/infra'
- name: terraform_working_directory
  value: '$(System.DefaultWorkingDirectory)'

pool:
  vmImage: ubuntu-latest

# For private agents (after VMSS is deployed):
# pool:
#   name: 'your-private-pool-name'
#   demands:
#   - agent.name -equals your-private-agent-name

stages:
########################################
# STAGE 1 - PLAN
########################################
- stage: Plan
  displayName: "Terraform Plan"
  jobs:
  - job: TerraformPlan
    displayName: "Plan Infrastructure"
    steps:
    - checkout: self

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: $(terraform_version)

    - task: AzureCLI@2
      displayName: "Terraform Init"
      inputs:
        azureSubscription: $(service_connection_name)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: "$(terraform_working_directory)"
        inlineScript: |
          echo "### Terraform INIT (Plan) ###"
          terraform init \
            -backend-config="resource_group_name=$(resource_group_tfstate)" \
            -backend-config="storage_account_name=$(storage_account_tfstate)" \
            -backend-config="container_name=$(container_tfstate)" \
            -backend-config="key=$(key_tfstate)"

    - task: AzureCLI@2
      displayName: "Terraform Plan"
      inputs:
        azureSubscription: $(service_connection_name)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: "$(terraform_working_directory)"
        inlineScript: |
          echo "### TERRAFORM PLAN ###"
          terraform plan \
            -var-file="./environments/${{ parameters.env }}.tfvars" \
            -out=tfplan \
            --refresh=false

    - task: PublishPipelineArtifact@1
      displayName: "Publish plan + lock"
      inputs:
        artifactName: "tfplan"
        targetPath: "$(terraform_working_directory)/tfplan"

    - task: PublishPipelineArtifact@1
      displayName: "Publish lock file"
      inputs:
        artifactName: "tfplan-lock"
        targetPath: "$(terraform_working_directory)/.terraform.lock.hcl"    

########################################
# STAGE 2 — APPLY (only on main)
########################################
- stage: Apply
  displayName: "Terraform Apply"
  dependsOn: Plan
  condition: 
    and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: TerraformApply
    displayName: "Apply Infrastructure"
    environment: "Infra-${{ parameters.env }}"   # configure approvals on this environment in DevOps
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: $(terraform_version)

          - task: DownloadPipelineArtifact@2
            inputs:
              artifactName: "tfplan"
              downloadPath: "$(terraform_working_directory)"

          - task: DownloadPipelineArtifact@2
            inputs:
              artifactName: "tfplan-lock"
              downloadPath: "$(terraform_working_directory)"    

          - task: AzureCLI@2
            displayName: "Terraform Init"
            inputs:
              azureSubscription: $(service_connection_name)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: "$(terraform_working_directory)"
              inlineScript: |
                echo "### Terraform INIT (Apply) with lockfile=readonly ###"
                terraform init \
                  -backend-config="resource_group_name=$(resource_group_tfstate)" \
                  -backend-config="storage_account_name=$(storage_account_tfstate)" \
                  -backend-config="container_name=$(container_tfstate)" \
                  -backend-config="key=$(key_tfstate)" \
                  -lockfile=readonly

          - task: AzureCLI@2
            displayName: "Terraform Apply"
            inputs:
              azureSubscription: $(service_connection_name)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: "$(terraform_working_directory)"
              inlineScript: |
                echo "### APPLY ###"
                terraform apply -input=false tfplan
