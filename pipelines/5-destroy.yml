trigger: none

name: 5-destroy-${{ parameters.env }}-${{ parameters.region }}

parameters:
- name: workload
  displayName: Workload
  type: string
  default: agenthubspoke
  values:
  - agenthubspoke

- name: env
  displayName: Environment
  type: string
  default: dev
  values:
  - dev
  - prd

- name: region
  displayName: Region
  type: string
  default: ne
  values:
  - ne
  - eus
  - sdc
  
- name: destroy_tfstate
  displayName: Destroy Terraform state backend after infra destroy
  type: boolean
  default: false

variables:
- group: ${{ parameters.workload }}.infra

- name: service_connection_name
  value: sp-${{ parameters.workload }}-${{ parameters.env }}

- name: resource_group_workload
  value: rg-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}

- name: resource_group_tfstate
  value: rg-tfs-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}

- name: storage_account_tfstate
  value: sttfs${{ parameters.workload }}${{ parameters.env }}${{ parameters.region }}

- name: container_tfstate
  value: tfs${{ parameters.workload }}${{ parameters.env }}${{ parameters.region }}

- name: key_tfstate
  value: tfs${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}.key

- name: terraform_version
  value: '1.11.3'

- name: terraform_working_directory
  value: '$(System.DefaultWorkingDirectory)'

pool:
  name: Azure Pipelines
  vmImage: ubuntu-latest

stages:
########################################
# STAGE 1 - DESTROY INFRASTRUCTURE
########################################
- stage: Destroy
  displayName: "Terraform Destroy - All Infrastructure"
  jobs:
  - deployment: TerraformDestroy
    displayName: "Destroy All Terraform Managed Resources"
    environment: "Infra-${{ parameters.env }}-Destroy"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: $(terraform_version)

          - task: AzureCLI@2
            displayName: "Terraform Init"
            inputs:
              azureSubscription: $(service_connection_name)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: "$(terraform_working_directory)"
              inlineScript: |
                echo "### Terraform INIT (Destroy) ###"
                rm -rf .terraform
                terraform init \
                  -backend-config="resource_group_name=$(resource_group_tfstate)" \
                  -backend-config="storage_account_name=$(storage_account_tfstate)" \
                  -backend-config="container_name=$(container_tfstate)" \
                  -backend-config="key=$(key_tfstate)" \
                  -backend-config="use_azuread_auth=true"

          - task: AzureCLI@2
            displayName: "Terraform Destroy - All Resources"
            inputs:
              azureSubscription: $(service_connection_name)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: "$(terraform_working_directory)"
              inlineScript: |
                echo "### TERRAFORM DESTROY - All Managed Resources ###"
                terraform destroy \
                  -var-file="./environments/${{ parameters.env }}.tfvars" \
                  -auto-approve

########################################
# STAGE 2 - OPTIONAL TFSTATE CLEANUP
########################################
- stage: CleanupTfState
  displayName: "Optional Cleanup - Terraform State Backend"
  dependsOn: Destroy
  condition: and(succeeded(), eq('${{ parameters.destroy_tfstate }}', 'true'))
  jobs:
  - deployment: Cleanup
    displayName: "Delete Terraform State Resource Group"
    environment: "Infra-${{ parameters.env }}-Destroy"
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: "Delete Terraform State Resource Group"
            inputs:
              azureSubscription: $(service_connection_name)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "### Deleting Terraform state backend resource group ###"
                echo "Resource Group: $(resource_group_tfstate)"
                az group delete --name "$(resource_group_tfstate)" --yes --no-wait
