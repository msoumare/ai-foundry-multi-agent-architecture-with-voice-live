trigger: none

name: 4-infra-${{ parameters.env }}-${{ parameters.region }}

parameters:
- name: workload
  displayName: Workload
  type: string
  default: agenthubspoke
  values:
  - agenthubspoke

- name: env
  displayName: Environment
  type: string
  default: dev
  values:
  - dev
  - prd

- name: region
  displayName: Region
  type: string
  default: ne
  values:
  - ne
  - eus

variables:
- group: ${{ parameters.workload }}.infra

- name: service_connection_name
  value: sp-${{ parameters.workload }}-${{ parameters.env }}

- name: resource_group_workload
  value: rg-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}

- name: resource_group_tfstate
  value: rg-tfs-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}

- name: storage_account_tfstate
  value: sttfs${{ parameters.workload }}${{ parameters.env }}${{ parameters.region }}

- name: container_tfstate
  value: tfs${{ parameters.workload }}${{ parameters.env }}${{ parameters.region }}

- name: key_tfstate
  value: tfs${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}.key

# Default region → NE
- name: location
  value: northeurope

# Override → East US
- ${{ if eq(parameters.region, 'eus') }}:
  - name: location
    value: eastus

- name: terraform_version
  value: '1.11.3'

- name: terraform_working_directory
  value: '$(System.DefaultWorkingDirectory)'

- name: agent_pool_name
  value: ${{ format('private-pool-{0}-{1}-{2}', parameters.workload, parameters.env, parameters.region) }}

pool:
  name: $(agent_pool_name)

stages:
########################################
# STAGE 1 - PLAN INFRASTRUCTURE
########################################
- stage: Plan
  displayName: "Terraform Plan - Core Infrastructure"
  jobs:
  - job: TerraformPlan
    displayName: "Plan Core Infrastructure"
    steps:
    - checkout: self

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: $(terraform_version)

    - task: AzureCLI@2
      displayName: "Terraform Init"
      inputs:
        azureSubscription: $(service_connection_name)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: "$(terraform_working_directory)"
        inlineScript: |
          echo "### Terraform INIT (Infra Plan) ###"
          rm -rf .terraform
          terraform init \
            -backend-config="resource_group_name=$(resource_group_tfstate)" \
            -backend-config="storage_account_name=$(storage_account_tfstate)" \
            -backend-config="container_name=$(container_tfstate)" \
            -backend-config="key=$(key_tfstate)" \
            -backend-config="use_azuread_auth=true"

    - task: AzureCLI@2
      displayName: "Terraform Plan - Core Infrastructure"
      inputs:
        azureSubscription: $(service_connection_name)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: "$(terraform_working_directory)"
        inlineScript: |
          echo "### TERRAFORM PLAN - Core Infrastructure ###"
          # Plan remaining core modules/resources explicitly.
          # Excludes resources already handled in earlier pipelines (network/devops bootstrap).
          terraform plan \
            -target=module.monitoring \
            -target=module.acr \
            -target=module.cosmosdb \
            -target=module.redis \
            -target=module.ai_foundry \
            -target=module.ai_search \
            -target=module.identity \
            -target=module.aks \
            -target=azurerm_role_assignment.aks_acr_pull \
            -target=azurerm_key_vault_secret.devops_ssh_private_key \
            -var-file="./environments/${{ parameters.env }}.tfvars" \
            -out=tfplan-infra 

    - task: PublishPipelineArtifact@1
      displayName: "Publish Infra plan"
      inputs:
        artifactName: "tfplan-infra"
        targetPath: "$(terraform_working_directory)/tfplan-infra"

########################################
# STAGE 2 — APPLY INFRASTRUCTURE
########################################
- stage: Apply
  displayName: "Terraform Apply - Core Infrastructure"
  dependsOn: Plan
  condition: succeeded()
  jobs:
  - deployment: TerraformApply
    displayName: "Apply Core Infrastructure"
    environment: "Infra-${{ parameters.env }}-Core"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: $(terraform_version)

          - task: DownloadPipelineArtifact@2
            inputs:
              artifactName: "tfplan-infra"
              downloadPath: "$(terraform_working_directory)"

          - task: AzureCLI@2
            displayName: "Terraform Init"
            inputs:
              azureSubscription: $(service_connection_name)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: "$(terraform_working_directory)"
              inlineScript: |
                echo "### Terraform INIT (Infra Apply) ###"
                rm -rf .terraform
                terraform init \
                  -backend-config="resource_group_name=$(resource_group_tfstate)" \
                  -backend-config="storage_account_name=$(storage_account_tfstate)" \
                  -backend-config="container_name=$(container_tfstate)" \
                  -backend-config="key=$(key_tfstate)" \
                  -backend-config="use_azuread_auth=true"

          - task: AzureCLI@2
            displayName: "Terraform Apply - Core Infrastructure"
            inputs:
              azureSubscription: $(service_connection_name)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: "$(terraform_working_directory)"
              inlineScript: |
                echo "### APPLY Core Infrastructure ###"
                terraform apply -input=false tfplan-infra
