trigger: none

name: 4-infra-${{ parameters.env }}-${{ parameters.region }}

parameters:
- name: workload
  displayName: Workload
  type: string
  default: agenthubspoke
  values:
  - agenthubspoke

- name: env
  displayName: Environment
  type: string
  default: dev
  values:
  - dev
  - prd

- name: region
  displayName: Region
  type: string
  default: ne
  values:
  - ne
  - eus
  - sdc
  - ncu
  
variables:
- group: ${{ parameters.workload }}.infra

- name: service_connection_name
  value: sp-${{ parameters.workload }}-${{ parameters.env }}

- name: resource_group_workload
  value: rg-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}

- name: resource_group_tfstate
  value: rg-tfs-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}

- name: storage_account_tfstate
  value: sttfs${{ parameters.workload }}${{ parameters.env }}${{ parameters.region }}

- name: container_tfstate
  value: tfs${{ parameters.workload }}${{ parameters.env }}${{ parameters.region }}

- name: key_tfstate
  value: tfs${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}.key

# Default region → NE
- name: location
  value: northeurope

# Override → East US
- ${{ if eq(parameters.region, 'eus') }}:
  - name: location
    value: eastus

- name: terraform_version
  value: '1.11.3'

- name: terraform_working_directory
  value: '$(System.DefaultWorkingDirectory)'

- name: agent_pool_name
  value: ${{ format('private-pool-{0}-{1}-{2}', parameters.workload, parameters.env, parameters.region) }}

pool:
  name: $(agent_pool_name)

stages:
########################################
# STAGE 1 - PLAN INFRASTRUCTURE
########################################
- stage: Plan
  displayName: "Terraform Plan - Core Infrastructure"
  jobs:
  - job: TerraformPlan
    displayName: "Plan Core Infrastructure"
    steps:
    - checkout: self

    - bash: |
        set -e
        required_tools=(az unzip terraform kubectl helm kubelogin curl jq wget gpg lsb_release)
        missing_tools=()

        for tool in "${required_tools[@]}"; do
          if ! command -v "$tool" >/dev/null 2>&1; then
            missing_tools+=("$tool")
          fi
        done

        if [[ ${#missing_tools[@]} -eq 0 ]]; then
          echo "All required tools already exist. Skipping bootstrap."
          exit 0
        fi

        echo "Missing tools: ${missing_tools[*]}"
        echo "Running agent tooling bootstrap..."
        if command -v sudo >/dev/null 2>&1; then
          sudo bash "$(System.DefaultWorkingDirectory)/modules/devops/install-agent.sh"
        else
          bash "$(System.DefaultWorkingDirectory)/modules/devops/install-agent.sh"
        fi
      displayName: "Run agent bootstrap script"

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: $(terraform_version)

    - task: AzureCLI@2
      displayName: "Terraform Init"
      inputs:
        azureSubscription: $(service_connection_name)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: "$(terraform_working_directory)"
        inlineScript: |
          echo "### Terraform INIT (Infra Plan) ###"
          rm -rf .terraform
          terraform init \
            -backend-config="resource_group_name=$(resource_group_tfstate)" \
            -backend-config="storage_account_name=$(storage_account_tfstate)" \
            -backend-config="container_name=$(container_tfstate)" \
            -backend-config="key=$(key_tfstate)" \
            -backend-config="use_azuread_auth=true"

    - task: AzureCLI@2
      displayName: "Terraform Plan - Core Infrastructure"
      inputs:
        azureSubscription: $(service_connection_name)
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: "$(terraform_working_directory)"
        inlineScript: |
          echo "### TERRAFORM PLAN - Core Infrastructure ###"
          # Plan remaining core modules/resources explicitly.
          # Excludes resources already handled in earlier pipelines (network/devops bootstrap).
          # Voice Live model mode is intentionally excluded from this pipeline target list.
          terraform plan \
            -target=module.monitoring \
            -target=module.acr \
            -target=module.cosmosdb \
            -target=module.redis \
            -target=module.storage \
            -target=module.ai_foundry \
            -target=module.voiceliveapi_agent_mode \
            -target=module.ai_search \
            -target=module.ai_foundry_identity \
            -target=module.aks \
            -target=azurerm_role_assignment.aks_acr_pull \
            -target=azurerm_key_vault_secret.devops_ssh_private_key \
            -var-file="./environments/${{ parameters.env }}.tfvars" \
            -out=tfplan-infra 

    - task: PublishPipelineArtifact@1
      displayName: "Publish Infra plan"
      inputs:
        artifactName: "tfplan-infra"
        targetPath: "$(terraform_working_directory)/tfplan-infra"

########################################
# STAGE 2 — APPLY INFRASTRUCTURE
########################################
- stage: Apply
  displayName: "Terraform Apply - Core Infrastructure"
  dependsOn: Plan
  condition: succeeded()
  jobs:
  - deployment: TerraformApply
    displayName: "Apply Core Infrastructure"
    environment: "Infra-${{ parameters.env }}-Core"
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - bash: |
              set -e
              required_tools=(az unzip terraform kubectl helm kubelogin curl jq wget gpg lsb_release)
              missing_tools=()

              for tool in "${required_tools[@]}"; do
                if ! command -v "$tool" >/dev/null 2>&1; then
                  missing_tools+=("$tool")
                fi
              done

              if [[ ${#missing_tools[@]} -eq 0 ]]; then
                echo "All required tools already exist. Skipping bootstrap."
                exit 0
              fi

              echo "Missing tools: ${missing_tools[*]}"
              echo "Running agent tooling bootstrap..."
              if command -v sudo >/dev/null 2>&1; then
                sudo bash "$(System.DefaultWorkingDirectory)/modules/devops/install-agent.sh"
              else
                bash "$(System.DefaultWorkingDirectory)/modules/devops/install-agent.sh"
              fi
            displayName: "Run agent bootstrap script"

          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: $(terraform_version)

          - task: DownloadPipelineArtifact@2
            inputs:
              artifactName: "tfplan-infra"
              downloadPath: "$(terraform_working_directory)"

          - task: AzureCLI@2
            displayName: "Terraform Init"
            inputs:
              azureSubscription: $(service_connection_name)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: "$(terraform_working_directory)"
              inlineScript: |
                echo "### Terraform INIT (Infra Apply) ###"
                rm -rf .terraform
                terraform init \
                  -backend-config="resource_group_name=$(resource_group_tfstate)" \
                  -backend-config="storage_account_name=$(storage_account_tfstate)" \
                  -backend-config="container_name=$(container_tfstate)" \
                  -backend-config="key=$(key_tfstate)" \
                  -backend-config="use_azuread_auth=true"

          - task: AzureCLI@2
            displayName: "Terraform Import Existing Core Resources (if needed)"
            inputs:
              azureSubscription: $(service_connection_name)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: "$(terraform_working_directory)"
              inlineScript: |
                set -euo pipefail

                SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                RG_NAME="$(resource_group_workload)"
                AI_NAME="ai-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}"
                REDIS_NAME="redis-${{ parameters.workload }}-${{ parameters.env }}-${{ parameters.region }}"

                AI_RESOURCE_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.CognitiveServices/accounts/${AI_NAME}"
                DIAG_NAME="diag-${AI_NAME}"
                DIAG_RESOURCE_ID="${AI_RESOURCE_ID}|${DIAG_NAME}"
                REDIS_RESOURCE_ID="/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG_NAME}/providers/Microsoft.Cache/redis/${REDIS_NAME}"

                import_if_exists() {
                  local state_address="$1"
                  local resource_id="$2"

                  if terraform state show "$state_address" >/dev/null 2>&1; then
                    echo "State already contains ${state_address}; skipping import."
                    return 0
                  fi

                  echo "Importing ${state_address}..."
                  terraform import \
                    -input=false \
                    -var-file="./environments/${{ parameters.env }}.tfvars" \
                    "$state_address" "$resource_id"
                }

                if az redis show --name "$REDIS_NAME" --resource-group "$RG_NAME" >/dev/null 2>&1; then
                  import_if_exists "module.redis.azurerm_redis_cache.this" "$REDIS_RESOURCE_ID"
                else
                  echo "Redis ${REDIS_NAME} not found; skipping import."
                fi

                if az monitor diagnostic-settings show --resource "$AI_RESOURCE_ID" --name "$DIAG_NAME" >/dev/null 2>&1; then
                  import_if_exists "module.ai_foundry.azurerm_monitor_diagnostic_setting.ai_services" "$DIAG_RESOURCE_ID"
                else
                  echo "Diagnostic setting ${DIAG_NAME} not found on ${AI_NAME}; skipping import."
                fi

          - task: AzureCLI@2
            displayName: "Terraform Apply - Core Infrastructure"
            inputs:
              azureSubscription: $(service_connection_name)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: "$(terraform_working_directory)"
              inlineScript: |
                echo "### APPLY Core Infrastructure ###"
                terraform apply -input=false tfplan-infra
