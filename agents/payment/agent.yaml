# yaml-language-server: $schema=https://raw.githubusercontent.com/microsoft/AgentSchema/refs/heads/main/schemas/v1.0/ContainerAgent.yaml

kind: hosted
name: payment-agent
description: Payment domain custom code hosted agent
protocols:
  - protocol: responses
    version: 1.0.0
resources:
  cpu: "0.25"
  memory: 0.5Gi
environment_variables:
  - name: APP_ENV
    value: ""
  - name: SERVICE_NAME
    value: ""
  - name: HOST
    value: ""
  - name: APPLICATIONINSIGHTS_USE_AAD_AUTH
    value: "false"
  - name: AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED
    value: "true"
