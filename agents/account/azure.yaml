# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0'
name: account
services:
    account-agent:
        name: account-agent
        description: Account domain custom code hosted agent
        project: .
        host: azure.ai.agent
        kind: hosted
        language: docker
        protocols:
            - protocol: responses
              version: 1.0.0
        docker:
            remoteBuild: true
        container:
            resources:
                cpu: "0.25"
                memory: 0.5Gi
        startupCommand: python main.py
        env:
            APP_ENV: ""
            SERVICE_NAME: ""
            HOST: ""
            APPLICATIONINSIGHTS_USE_AAD_AUTH: "false"
            AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED: "true"
