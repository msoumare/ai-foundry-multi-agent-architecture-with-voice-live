# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=0.1.0-preview'
name: account
services:
    account-agent:
        project: .
        host: azure.ai.agent
        language: docker
        docker:
            image: account-agent
            remoteBuild: false
        container:
            resources:
                cpu: "0.25"
                memory: 0.5Gi
        env:
            SERVICE_NAME: "account-agent"
            SERVICE_HOST: "0.0.0.0"
            SERVICE_PROJECT_ENDPOINT: "https://aifd-coba-poc-managed-dev-03.services.ai.azure.com/api/projects/aifd-coba-poc-managed-dev-03-project-alpha"
            SERVICE_MODEL_DEPLOYMENT: "gpt-5.1-managed"
            HUB_AGENT_NAME: "hub-agent"
            AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED: "true"
        kind: hosted
        name: account-agent
        description: Account domain agent — handles profile updates, account access, status, and statements
        protocols:
            - protocol: responses
              version: 1.0.0
