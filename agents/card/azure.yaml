# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=0.1.0-preview'
name: card
services:
    card-agent:
        project: .
        host: azure.ai.agent
        language: docker
        docker:
            image: card-agent
            remoteBuild: true
        container:
            resources:
                cpu: "0.25"
                memory: 0.5Gi
        env:
            SERVICE_NAME: "card-agent"
            SERVICE_HOST: "0.0.0.0"
            SERVICE_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT}
            SERVICE_MODEL_DEPLOYMENT: ${AGENTHUB_MODEL_DEPLOYMENT}
            ACCOUNT_AGENT_NAME: "account-agent"
            PAYMENT_AGENT_NAME: "payment-agent"
            HUB_AGENT_NAME: "hub-agent"
            AZURE_TRACING_GEN_AI_CONTENT_RECORDING_ENABLED: "true"
        kind: hosted
        name: card-agent
        description: Card domain agent — lost/stolen cards, replacements, activation, limits, and PIN management
        protocols:
            - protocol: responses
              version: 1.0.0
